---

name:  "Github Actions Molecule Ansible Workflow"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jobid_1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Molecule
        working-directory: roles/nginx
        run: molecule test

permissions:
  contents: read

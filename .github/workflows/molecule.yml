---

name:  "Github Actions Molecule Ansible Workflow"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jobid_1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --allow-unauthenticated --upgrade pip
          if [ -f requirements.txt ]; then pip install -f requirements.txt; fi
      
      - name: Run Molecule
        working-directory: roles/nginx
        run: molecule test

permissions:
  contents: read
